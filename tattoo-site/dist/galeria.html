<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <section class="gallery-hero">
    <div class="gallery-hero__veil" id="dither-hero"></div>
    <div class="gallery-hero__content">
      <p class="gallery-hero__eyebrow">TORUS TATTOO · ACERVO</p>
      <h1 class="gallery-hero__title">Galeria</h1>
      <p class="gallery-hero__hint">Passe o cursor para revelar <span>↗</span></p>

    <span class="gallery-hero__scroll" aria-hidden="true">ROLE PARA EXPLORAR <span>↓</span></span>

  <div class="museum" id="museum">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <p class="museum__count"><span id="museum-total">00</span> OBRAS</p>
    </header>

    <div class="museum__viewport">
      <nav class="gallery-filters" id="gallery-filters" aria-label="Filtrar por estilo"></nav>

      <div class="gallery-window">
        <div class="gallery-track" id="gallery-track"></div>
      </div>
    </div>

  <div class="gallery-bottom-fade" aria-hidden="true"></div>
